# OCB (OpenTelemetry Collector Builder) config.
# Build: ocb --config collector/builder-config.yaml
#
# The `replaces` directive maps the local module into the generated go.mod
# so the local extension and processor packages are used without publishing.

dist:
  name: hangtail-collector
  description: "OpenTelemetry Collector distribution with hangtail"
  output_path: ./bin
  otelcol_version: "0.104.0"

replaces:
  - github.com/madcok/hangtail => ../

extensions:
  - gomod: github.com/madcok/hangtail/extension/hangtailextension v0.1.0
  - gomod: go.opentelemetry.io/collector/extension/zpagesextension v0.104.0

processors:
  - gomod: github.com/madcok/hangtail/processor/hangtailprocessor v0.1.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.104.0
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.104.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.104.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.104.0
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.104.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.104.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.11.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.11.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.11.0
